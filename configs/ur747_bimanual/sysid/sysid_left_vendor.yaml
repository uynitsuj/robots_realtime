# SYS-ID of the vendor follower controller, left arm: same trajectories on "Default program".
# Excitation trajectories only: below ~0.075 rad/s the vendor follower ignores register changes (its
# slow-target deadband), so static holds and slow friction strokes would stall and abort. Expect larger
# steady errors and lag than on "rr servo": that is what this run measures.
#
# Each trajectory is recorded as its own episode (follower joint_state with the full RTDE field list,
# agent state with the commands as sent). Generate the trajectories first (deterministic, validated
# against configs/ur747_bimanual/sysid/envelope.yaml):
#   .venv/bin/rr-ur-sysid-traj --arm left --out sysid/trajectories
# Comment out entries to run a subset. Start with the arm near its rig home pose (the approach is
# refused if the arm starts outside the envelope).
#   uv run rr-session configs/ur747_bimanual/sysid/sysid_left_vendor.yaml
version: "1"

session:
  save_root: recordings/ur747_sysid
  record_topic: sysid_left/record

nodes:
  - type: AgentNode
    name: sysid_left
    agent_class: robots_realtime.agents.sysid.trajectory_agent:SysidTrajectoryAgent
    agent_kwargs:
      arm: left
      robot_name: arm_left_follower
      approach_vel: 0.2
      settle_s: 2.0
      pause_s: 3.0
      max_track_error: 0.3
      trajectories:
        - sysid/trajectories/left_excite_c0.npz
        - sysid/trajectories/left_excite_c1.npz
        - sysid/trajectories/left_excite_c2.npz
        - sysid/trajectories/left_excite_c3.npz
        - sysid/trajectories/left_excite_c4.npz
    state_topics:
      arm_left_follower: arm_left_follower/joint_state
    loop_mode: fixed_rate
    poll_freq: 500

  - type: RobotNode
    name: arm_left_follower
    robot_config: robot_configs/ur747/left_follower_sysid_vendor.yaml
    cmd_topic: sysid_left/joint_pos
    cmd_timeout_s: 0.1
    poll_freq: 500
    startup_joint_pos: null
    shutdown_joint_pos: null
    ramp_duration_s: 1.5
