# SYS-ID DRY RUN, right follower READ-ONLY: validates and streams the whole plan, commands are only logged.
# The arm does not move, so the tracking-error abort is disabled here.
#
# Each trajectory is recorded as its own episode (follower joint_state with the full RTDE field list,
# agent state with the commands as sent). Generate the trajectories first (deterministic, validated
# against configs/ur747_bimanual/sysid/envelope.yaml):
#   .venv/bin/rr-ur-sysid-traj --arm right --out sysid/trajectories
# Comment out entries to run a subset. Start with the arm near its rig home pose (the approach is
# refused if the arm starts outside the envelope).
#   uv run rr-session configs/ur747_bimanual/sysid/sysid_right_dryrun.yaml
version: "1"

session:
  save_root: recordings/ur747_sysid
  record_topic: sysid_right/record

nodes:
  - type: AgentNode
    name: sysid_right
    agent_class: robots_realtime.agents.sysid.trajectory_agent:SysidTrajectoryAgent
    agent_kwargs:
      arm: right
      robot_name: arm_right_follower
      approach_vel: 0.2
      settle_s: 2.0
      pause_s: 3.0
      max_track_error: 100.0
      trajectories:
        - sysid/trajectories/right_static.npz
        - sysid/trajectories/right_friction.npz
        - sysid/trajectories/right_excite_c0.npz
        - sysid/trajectories/right_excite_c1.npz
        - sysid/trajectories/right_excite_c2.npz
        - sysid/trajectories/right_excite_c3.npz
        - sysid/trajectories/right_excite_c4.npz
    state_topics:
      arm_right_follower: arm_right_follower/joint_state
    loop_mode: fixed_rate
    poll_freq: 500

  - type: RobotNode
    name: arm_right_follower
    robot_config: robot_configs/ur747/right_follower_readonly.yaml
    cmd_topic: sysid_right/joint_pos
    cmd_timeout_s: 0.1
    poll_freq: 500
    startup_joint_pos: null
    shutdown_joint_pos: null
    ramp_duration_s: 1.5
